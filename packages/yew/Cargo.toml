[package]
name = "yew"
version = "0.23.0"
edition = "2021"
authors = [
  "Denis Kolodin <deniskolodin@gmail.com>",
  "Justin Starry <justin@yew.rs>",
]
repository = "https://github.com/yewstack/yew"
homepage = "https://yew.rs"
documentation = "https://docs.rs/yew/"
license = "MIT OR Apache-2.0"
keywords = ["web", "webasm", "wasi"]
categories = ["gui", "wasm"]
description = "A framework for creating reliable and efficient web applications"
readme = "../../README.md"
rust-version = "1.84.0"

[dependencies]
indexmap = { version = "2.13", features = ["std"] }
lynx_sys = { path = "../lynx_sys", default-features = false }
slab = "0.4"
yew-macro = { version = "^0.23.0", path = "../yew-macro" }
thiserror.workspace = true
futures = { workspace = true, features = ["std", "executor"] }
implicit-clone = { workspace = true, features = ["map"] }
tracing = "0.1.44"

[features]
csr = []
default = []
test = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "documenting"]

[lints]
workspace = true
